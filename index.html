<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafi Coin Crypto currency</title>
    <style>
        :root {
            --gold: #ffcc00;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-gray: #aaaaaa;
            --green: #00ff00;
            --red: #ff4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        nav span { cursor: pointer; font-weight: bold; color: var(--text-gray); font-size: 1.1em; }
        nav span.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        .page { display: none; width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        .active-page { display: block; }

        .logo-container { text-align: center; margin: 20px 0; position: relative; }
        .header-logo { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 20px rgba(255, 204, 0, 0.6); }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #333; }
        
        .card h3 { 
            margin: 0 0 10px 0; 
            font-size: 0.8em; 
            color: var(--text-gray); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 5px;
        }

        /* The updated Rafi Coin Icon */
        .mini-coin { width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; }

        .balance { font-size: 2em; font-weight: bold; color: var(--gold); margin: 10px 0; }
        
        button { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; font-size: 1em; }
        button:active { transform: scale(0.95); }

        input { width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 10px 0; background: #2a2a2a; color: white; text-align: center; font-size: 1.2em; }

        .stock-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-top: 10px; border: 1px solid #333; }
        .ticker { color: var(--green); font-weight: bold; font-family: monospace; font-size: 1.4em; display: block; margin: 5px 0; }

        .rank-card { background: var(--card-bg); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid var(--gold); }
        .req-section { background: var(--card-bg); padding: 20px; border-radius: 20px; margin-top: 20px; border: 1px solid #333; }
        .req-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2a2a2a; }
    </style>
</head>
<body>

    <nav>
        <span id="nav-exchange" class="active" onclick="showPage('exchange')">EXCHANGE</span>
        <span id="nav-rank" onclick="showPage('rank')">RANK</span>
    </nav>

    <div id="exchange-page" class="page active-page">
        <div class="logo-container">
            <img src="2455.png" class="header-logo">
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3>💰 MONEY</h3>
                <div class="balance" id="money-display">$0</div>
            </div>
            <div class="card">
                <h3><img src="2455.png" class="mini-coin"> RAFI COIN</h3>
                <div class="balance" id="coin-display">0</div>
                <button onclick="buyRafi()">Buy ($1500)</button>
            </div>
        </div>

        <div class="dashboard">
            <section class="card">
                <h3>🧮 MATH MINE</h3>
                <p id="math-question" style="font-weight: bold; font-size: 1.3em; margin: 15px 0;"></p>
                <input type="number" id="math-answer" placeholder="?">
                <button onclick="checkMath()">Submit</button>
            </section>

            <section class="card">
                <h3>📈 STOCKS ($60)</h3>
                <div class="stock-box">
                    <span style="font-size: 0.8em; color: var(--text-gray);">Rafi's Fart</span>
                    <span id="fart-price" class="ticker">$60</span>
                    <button class="trade-btn" onclick="invest('fart')">Invest</button>
                </div>
                <div class="stock-box">
                    <span style="font-size: 0.8em; color: var(--text-gray);">Cudling Pong</span>
                    <span id="pong-price" class="ticker">$60</span>
                    <button class="trade-btn" onclick="invest('pong')">Invest</button>
                </div>
                <p id="timer-text" style="display:none; color: var(--red); font-weight: bold; font-size: 0.8em; margin-top: 10px;">
                    TIME: <span id="timer">40</span>s
                </p>
            </section>
        </div>
    </div>

    <div id="rank-page" class="page">
        <h1 style="text-align: center;">Global Rank</h1>
        <div class="rank-card">
            <div id="rank-icon" style="font-size: 5em;">🥚</div>
            <h2 id="rank-title" style="color: var(--gold);">Newbie</h2>
            <p style="color: var(--text-gray);">Holdings: <span id="rank-coin-count" style="color: white; font-weight: bold;">0</span> Coins</p>
            <div id="drop-timer" style="color: var(--red); font-weight: bold; border: 1px solid var(--red); padding: 10px; border-radius: 10px; margin-top: 15px;">
                Reset in: --d
            </div>
        </div>

        <div class="req-section">
            <h3 style="color: var(--gold); border-bottom: 1px solid #333; padding-bottom: 10px;">RANK REQUIREMENTS</h3>
            <div class="req-item"><span>🥚 Newbie</span><span style="color: var(--gold)">0 Coins</span></div>
            <div class="req-item"><span>🌟 Bronze</span><span style="color: var(--gold)">30 Coins</span></div>
            <div class="req-item"><span>🔥 Silver</span><span style="color: var(--gold)">70 Coins</span></div>
            <div class="req-item"><span>💎 Gold Whale</span><span style="color: var(--gold)">100 Coins</span></div>
            <div class="req-item"><span>👑 Rafi King</span><span style="color: var(--gold)">160 Coins</span></div>
        </div>
    </div>

    <script>
        let balance = parseInt(localStorage.getItem('rafi_balance')) || 500;
        let rafiCoins = parseInt(localStorage.getItem('rafi_coins')) || 0;
        let resetDate = localStorage.getItem('rafi_reset_date') || (new Date().getTime() + (60 * 24 * 60 * 60 * 1000));
        localStorage.setItem('rafi_reset_date', resetDate);

        let isTrading = false;
        let currentMathAnswer = 0;

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('nav span').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active-page');
            document.getElementById('nav-' + pageId).classList.add('active');
            if(pageId === 'rank') updateRank();
        }

        function generateMath() {
            const n1 = Math.floor(Math.random() * 50) + 10;
            const n2 = Math.floor(Math.random() * 50) + 10;
            currentMathAnswer = n1 + n2;
            document.getElementById('math-question').innerText = `${n1} + ${n2} = ?`;
        }

        function checkMath() {
            const input = document.getElementById('math-answer');
            if (parseInt(input.value) === currentMathAnswer) {
                balance += Math.floor(Math.random() * 30) + 20;
                save(); updateUI(); generateMath();
            }
            input.value = "";
        }

        function buyRafi() {
            if (balance >= 1500) {
                balance -= 1500;
                rafiCoins++;
                save(); updateUI();
            } else { alert("Insufficient funds! You need $1500."); }
        }

        function invest(type) {
            if (balance < 60 || isTrading) return;
            balance -= 60;
            isTrading = true;
            updateUI();
            
            document.querySelectorAll('.trade-btn').forEach(b => b.disabled = true);
            document.getElementById('timer-text').style.display = "block";
            
            let sec = 40;
            const activeTicker = document.getElementById(`${type}-price`);
            const otherTicker = document.getElementById(type === 'fart' ? 'pong-price' : 'fart-price');

            const t = setInterval(() => {
                sec--;
                document.getElementById('timer').innerText = sec;
                activeTicker.innerText = `$${Math.floor(Math.random() * 300)}`;
                otherTicker.innerText = "$60";

                if (sec <= 0) {
                    clearInterval(t);
                    const payout = Math.floor(Math.random() * 400);
                    balance += payout;
                    isTrading = false;
                    document.querySelectorAll('.trade-btn').forEach(b => b.disabled = false);
                    document.getElementById('timer-text').style.display = "none";
                    activeTicker.innerText = "$60";
                    save(); updateUI();
                    alert(`Market closed! You earned: $${payout}`);
                }
            }, 1000);
        }

        function updateRank() {
            let title = "Newbie"; let icon = "🥚";
            if (rafiCoins >= 160) { title = "Coin King"; icon = "👑"; }
            else if (rafiCoins >= 100) { title = "Gold Whale"; icon = "💎"; }
            else if (rafiCoins >= 70) { title = "Silver Investor"; icon = "🔥"; }
            else if (rafiCoins >= 30) { title = "Bronze Holder"; icon = "🌟"; }
            document.getElementById('rank-title').innerText = title;
            document.getElementById('rank-icon').innerText = icon;
            document.getElementById('rank-coin-count').innerText = rafiCoins;

            const daysLeft = Math.ceil((resetDate - new Date().getTime()) / (1000 * 60 * 60 * 24));
            document.getElementById('drop-timer').innerText = `Season Reset: ${daysLeft}d remaining`;
            
            if (daysLeft <= 0) {
                rafiCoins = 0; save(); updateRank();
            }
        }

        function save() {
            localStorage.setItem('rafi_balance', balance);
            localStorage.setItem('rafi_coins', rafiCoins);
        }

        function updateUI() {
            document.getElementById('money-display').innerText = `$${balance}`;
            document.getElementById('coin-display').innerText = rafiCoins;
        }

        updateUI(); generateMath();
    </script>
</body>
</html>
